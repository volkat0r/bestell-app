<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/font-face.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/menu.js"></script>
    <script src="./scripts/templates.js"></script>
</head>
<body onload="init()">
    <header>
        <div class="wrapper">
            <div class="logo">
                <img src="./assets/icons/logo.svg" alt="Logo of Bestell App">
            </div>
            <h1>Speisenkarte</h1>
            <div class="navBar">
                <img src="./assets/icons/hamburger-nav.svg" alt="Navigation">
            </div>
        </div>
    </header>
    <main>
        <div class="wrapper">
            <section id="content">
                <section id="menuArea">
                    <section id="local"></section>
                    <ul class="menuCategory"></ul>
                    <div id="menuItems"></div>
                </section>
            </section>
            <section id="cart" class="empty">
                <button id="mobileCartButton"><img src="./assets/icons/basket.svg" alt="Mobile Cart"><span id="cartItemCounter"></span></button>
                <div class="cartInner">
                    <h2>Basket</h2>
                    <span class="emptyBasket"><img src="./assets/icons/empty-basket.svg" alt="Empty Basket"></span>
                    <div id="basket"></div>
                    <div id="cartBottom"></div>
                </div>
            </section>
            <dialog id="afterOrderMessage">
                <button type="submit" id="closeDialog"><img src="./assets/icons/remove.svg" alt="remove Item"></button>
                <h3>Thank you for your order!</h3>
                <p>We’re getting everything ready and will notify you once it’s on the way.</p>
            </dialog>
        </div>
    </main>
    <footer>
        <div class="wrapper">
            <div id="footerContent">
                <ul class="">
                    <li><a href="">Impressum</a></li>
                    <li><a href="">AGB</a></li>
                    <li><a href="">About</a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>
<script src="./script.js"></script>
</html>
